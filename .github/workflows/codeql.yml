name: "CodeQL"

on:
  push:
    branches: [ "main", "ci/**", "feat/**", "test/**", "fix/**" ]
  pull_request:
    branches: [ "main", "ci/**", "feat/**", "test/**", "fix/**" ]
  schedule:
    - cron: '16 3 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: manual
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies (Linux C/C++)
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - name: Run manual build steps (C/C++)
      if: matrix.language == 'c-cpp' && matrix.build-mode == 'manual'
      shell: bash
      run: |
        cmake -S . -B build-codeql -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DNFX_SILICON_BUILD_TESTS=OFF \
          -DNFX_SILICON_ENABLE_NATIVE_OPTIMIZATIONS=OFF \
          -DNFX_SILICON_WARNINGS_AS_ERRORS=ON
        cmake --build build-codeql --parallel

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
